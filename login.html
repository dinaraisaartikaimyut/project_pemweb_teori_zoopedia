<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Zoopedia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-logo"><span class="z">Zoo</span><span class="p">pedia</span></div>
      <h2>Masuk ke Akun</h2>
      <p class="sub">Selamat datang kembali! Yuk lanjut belajar.</p>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" />
      </div>

      <p id="error-msg" class="error-msg"></p>
      <button class="btn btn-primary" onclick="doLogin()">Masuk</button>

      <div class="auth-link">
        Belum punya akun? <a href="register.html">Daftar di sini</a>
      </div>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
