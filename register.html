<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar - Zoopedia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-logo"><span class="z">Zoo</span><span class="p">pedia</span></div>
      <h2>Buat Akun Baru</h2>
      <p class="sub">Daftar gratis dan mulai bermain kuis hewan!</p>

      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama kamu" />
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Buat username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Buat password" />
      </div>
      <div class="form-group">
        <label for="konfirmasi">Konfirmasi Password</label>
        <input type="password" id="konfirmasi" placeholder="Ulangi password" />
      </div>

      <p id="error-msg" class="error-msg"></p>
      <p id="success-msg" class="success-msg"></p>
      <button class="btn btn-primary" onclick="doRegister()">Daftar Sekarang</button>

      <div class="auth-link">
        Sudah punya akun? <a href="login.html">Masuk di sini</a>
      </div>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
